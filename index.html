<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2.2Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
  

  
<body>
  
<div id="loading-screen">
  <div class="stars"></div>
  <div class="loading-text">Loading...</div>
</div>


  
  <!-- BACK -->
  <div class="back-btn" onclick="goHome()">BACK</div>

  <!-- Corner Cards -->
 <div class="corner-card top-left">

  <div class="music-player">

    <!-- 上排 -->
<div class="music-top">

  <div class="vinyl">
    <div class="vinyl-disc">
      <img src="dj.jpg">
    </div>
  </div>

  <div class="track-info">
    <div class="marquee">
      <span id="track-name">Track Name</span>
    </div>
  </div>

</div>

    <!-- 中間：進度 -->
    <div class="progress-area">
      <input type="range" id="progress" value="0">
      <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- 控制 -->
    <div class="controls">
      <button onclick="prevTrack()">⏮</button>
      <button onclick="togglePlay()" id="playBtn">▶</button>
      <button onclick="nextTrack()">⏭</button>
    </div>

  </div>

</div>
 <div class="corner-card bottom-right">
  <div class="about-title">PROJECT OVERVIEW</div>

  <div class="about-text">
    本作品以個人作品集網站為核心，結合視覺設計與前端開發，打造具有沉浸感的互動介面。<br><br>

    透過版面配置、動畫轉場與音樂播放器的整合，提升整體觀看體驗，使使用者在瀏覽過程中能直觀感受創作脈絡與風格呈現。<br><br>

    此實作不僅展現設計能力，也體現將概念轉化為數位互動作品的整合實力。
  </div>
</div>

  <!-- ===== 封面 ===== -->
  <!-- 封面 UI（獨立層） -->
<div class="hero-ui">

  <img src="title.jpg" class="title-img">

  <button class="start-btn" onclick="startSite()">START</button>

</div>

<!-- page 保留（但裡面不要放 title） -->
<section class="page active-page" id="home"></section>
  <!-- ===== TAB SYSTEM ===== -->
  <nav class="tabs">

    <div class="tab" onclick="goToPage(1)">創作起點</div>
    <div class="tab" onclick="goToPage(2)">互動頁面</div>
    <div class="tab" onclick="goToPage(3)">作品展示</div>
    <div class="tab" onclick="goToPage(4)">歷程記錄</div>
    <div class="tab" onclick="goToPage(5)">未來展望</div>

  </nav>

  <!-- ===== 內容頁面 ===== -->

  <section class="page" id="page1">創作起點內容</section>
  <section class="page" id="page2">互動頁面內容</section>
  <section class="page" id="page3">作品展示內容</section>
  <section class="page" id="page4">歷程記錄內容</section>
  <section class="page" id="page5">未來展望內容</section>

  <script src="script.js"></script>
</body>
</html>
