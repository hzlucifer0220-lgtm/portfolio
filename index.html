<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- BACK -->
  <div class="back-btn" onclick="goHome()">BACK</div>

  <!-- Corner Cards -->
  <div class="corner-card top-left">MUSIC / CONTROL</div>
  <div class="corner-card bottom-right">ABOUT / TAG</div>

  <!-- ===== 封面 ===== -->
  <section class="page hero-page active-page" id="home">

  <img src="title.jpg" class="tittle-img" alt="title">

  <button class="start-btn" onclick="startSite()">
    START
  </button>

</section>
  <!-- ===== TAB SYSTEM ===== -->
  <nav class="tabs">

    <div class="tab" onclick="goToPage(1)">創作起點</div>
    <div class="tab" onclick="goToPage(2)">互動頁面</div>
    <div class="tab" onclick="goToPage(3)">作品展示</div>
    <div class="tab" onclick="goToPage(4)">歷程記錄</div>
    <div class="tab" onclick="goToPage(5)">未來展望</div>

  </nav>

  <!-- ===== 內容頁面 ===== -->

  <section class="page" id="page1">創作起點內容</section>
  <section class="page" id="page2">互動頁面內容</section>
  <section class="page" id="page3">作品展示內容</section>
  <section class="page" id="page4">歷程記錄內容</section>
  <section class="page" id="page5">未來展望內容</section>

  <script src="script.js"></script>
</body>
</html>
