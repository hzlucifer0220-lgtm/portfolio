<!DOCTYPE html>
<html lang="zh">

  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 背景 -->
  <div class="bg"></div>

  <!-- Corner Card -->
  <div class="corner-card top-left">
    MUSIC / CONTROL
  </div>

  <div class="corner-card bottom-right">
    ABOUT / TAG
  </div>

  <!-- HERO -->

    <h1 class="title">YOUR NAME</h1>

    <p class="subtitle">
      DESIGN / ART / INTERACTION / AI

    </p>

    <button class="start-btn" onclick="startTransition()">
      START
    </button>

  </section>

  <!-- TAB SYSTEM -->

    <div class="tab">CREATION</div>
    <div class="tab">INTERACTION</div>
